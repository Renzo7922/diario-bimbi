<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b4bdb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json"><title>Diario Bimbi</title>
<style>
:root{--p:#5b4bdb;--bg:#f6f7fb;--card:#fff;--text:#202124;--muted:#68707d;--danger:#c62828;--border:#e2e5ec}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:var(--p);color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:3}header h1{margin:0;font-size:25px}header small{opacity:.9}.wrap{max-width:760px;margin:auto;padding:14px}.nav{display:flex;gap:8px;overflow:auto;padding:8px 0 12px}.nav button{white-space:nowrap}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #00000008}h2,h3{margin:5px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.grid{grid-template-columns:1fr}}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fff;font:inherit}textarea{min-height:80px}button{border:0;border-radius:10px;padding:10px 13px;background:var(--p);color:#fff;font-weight:600}button.secondary{background:#eef0f6;color:#30343b}button.danger{background:#fff0f0;color:var(--danger)}button.link{background:none;color:var(--p);padding:5px}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}.pill{display:inline-block;background:#eeeafe;color:#4c3fc0;padding:4px 8px;border-radius:999px;font-size:12px}.item-title{font-weight:700;font-size:17px}.empty{text-align:center;padding:28px;color:var(--muted)}.hidden{display:none}.top-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.mini{font-size:13px}.section{margin-top:18px}.danger-text{color:var(--danger)}
</style></head>
<body><header><div class="wrap"><h1>👶 Diario Bimbi</h1><small>Diario sanitario familiare · v0.3</small></div></header>
<main class="wrap"><div class="nav"><button onclick="show('home')">🏠 Home</button><button onclick="show('children')">👶 Bambini</button><button onclick="show('history')">📋 Storico</button><button onclick="show('agenda')">⏰ Agenda</button></div><div id="app"></div></main>
<script>
const KEY='diariobimbi.pwa.v1'; let db=JSON.parse(localStorage.getItem(KEY)||'{"children":[],"events":[],"reminders":[]}');
const save=()=>localStorage.setItem(KEY,JSON.stringify(db)); const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'}):'';
function childOptions(selected=''){return '<option value="">Seleziona bambino</option>'+db.children.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')}
function show(page='home'){window.scrollTo(0,0); const a=document.getElementById('app'); if(page==='children') return childrenPage(a); if(page==='history') return historyPage(a); if(page==='agenda') return agendaPage(a); homePage(a)}
function homePage(a){a.innerHTML=`<div class="card"><div class="top-actions"><div><h2>Benvenuto</h2><div class="muted">Gestisci in modo ordinato il diario dei bambini.</div></div><span class="pill">Demo</span></div></div><div class="grid"><div class="card"><h3>👶 Bambini</h3><b>${db.children.length}</b><div class="muted mini">profili</div><button style="margin-top:10px" onclick="show('children')">Apri</button></div><div class="card"><h3>📋 Eventi</h3><b>${db.events.length}</b><div class="muted mini">registrati</div><button style="margin-top:10px" onclick="show('history')">Apri</button></div></div><div class="card"><h3>➕ Nuovo</h3><div class="row"><button onclick="newEvent()">Diario sanitario</button><button onclick="newReminder()">Promemoria</button></div></div>`}
function childrenPage(a){a.innerHTML=`<div class="top-actions"><h2>👶 Profili bambini</h2><button onclick="newChild()">+ Bambino</button></div>${db.children.length?db.children.map(c=>`<div class="card"><div class="item-title">${esc(c.name)}</div><div class="muted">Nato/a: ${esc(c.birthDate||'—')}</div><div class="row" style="margin-top:10px"><button class="secondary" onclick="editChild('${c.id}')">✏️ Modifica</button><button class="danger" onclick="deleteChild('${c.id}')">🗑️ Elimina</button></div></div>`).join(''):'<div class="empty">Nessun bambino inserito.</div>'}`}
function newChild(editId=''){const c=db.children.find(x=>x.id===editId)||{}; const name=prompt('Nome del bambino:',c.name||''); if(name===null)return; if(!name.trim())return alert('Inserisci un nome.'); const birth=prompt('Data di nascita (es. 12/03/2023):',c.birthDate||''); if(editId){c.name=name.trim();c.birthDate=birth||''}else db.children.push({id:uid(),name:name.trim(),birthDate:birth||''});save();show('children')}
const editChild=id=>newChild(id); function deleteChild(id){if(!confirm('Eliminare il profilo e i dati collegati?'))return;db.children=db.children.filter(c=>c.id!==id);db.events=db.events.filter(e=>e.childId!==id);db.reminders=db.reminders.filter(r=>r.childId!==id);save();show('children')}
function eventForm(e={}){document.getElementById('app').innerHTML=`<div class="card"><h2>${e.id?'✏️ Modifica evento':'➕ Nuovo evento sanitario'}</h2><label>Bambino</label><select id="fchild">${childOptions(e.childId||'')}</select><label>Data e ora</label><input id="fdate" type="datetime-local" value="${e.date?new Date(e.date).toISOString().slice(0,16):new Date().toISOString().slice(0,16)}"><label>Titolo / motivo</label><input id="ftitle" value="${esc(e.title||'')}"><label>Sintomi</label><textarea id="fsym">${esc(e.symptoms||'')}</textarea><div class="grid"><div><label>Temperatura</label><input id="ftemp" value="${esc(e.temperature||'')}" placeholder="es. 38,5 °C"></div><div><label>Farmaco</label><input id="fmed" value="${esc(e.medicine||'')}"></div></div><label>Dose inserita</label><input id="fdose" value="${esc(e.dose||'')}"><label>Note</label><textarea id="fnote">${esc(e.notes||'')}</textarea><div class="row" style="margin-top:12px"><button onclick="saveEventForm('${e.id||''}')">Salva</button><button class="secondary" onclick="show('history')">Annulla</button></div></div>`}
function newEvent(){if(!db.children.length)return alert('Prima crea almeno un profilo bambino.');eventForm()}
function saveEventForm(id){const childId=fchild.value;if(!childId)return alert('Seleziona il bambino.');const data={childId,date:new Date(fdate.value).toISOString(),title:ftitle.value.trim()||'Evento sanitario',symptoms:fsym.value.trim(),temperature:ftemp.value.trim(),medicine:fmed.value.trim(),dose:fdose.value.trim(),notes:fnote.value.trim()};if(id){Object.assign(db.events.find(e=>e.id===id),data)}else db.events.push({id:uid(),...data});save();show('history')}
function editEvent(id){eventForm(db.events.find(e=>e.id===id)||{})} function deleteEvent(id){if(!confirm('Eliminare questo evento?'))return;db.events=db.events.filter(e=>e.id!==id);save();show('history')}
function eventMini(e){const c=db.children.find(x=>x.id===e.childId);return `<div class="card"><div class="item-title">${esc(e.title)}</div><div class="muted">${esc(c?.name||'')} · ${fmt(e.date)}</div>${e.symptoms?`<div><b>Sintomi:</b> ${esc(e.symptoms)}</div>`:''}${e.temperature?`<div><b>Temperatura:</b> ${esc(e.temperature)}</div>`:''}${e.medicine?`<div><b>Farmaco:</b> ${esc(e.medicine)} ${esc(e.dose)}</div>`:''}${e.notes?`<div><b>Note:</b> ${esc(e.notes)}</div>`:''}<div class="row" style="margin-top:10px"><button class="secondary" onclick="editEvent('${e.id}')">✏️ Modifica</button><button class="danger" onclick="deleteEvent('${e.id}')">🗑️ Elimina</button></div></div>`}
function historyPage(a){a.innerHTML=`<div class="top-actions"><h2>📋 Storico completo</h2><button onclick="newEvent()">+ Evento</button></div><div class="card"><label>Cerca</label><input id="search" placeholder="sintomo, farmaco, note..." oninput="renderHistory()"><label>Filtra bambino</label><select id="filter" onchange="renderHistory()">${childOptions()}</select></div><div id="hist"></div>`;renderHistory()}
function renderHistory(){const q=(document.getElementById('search')?.value||'').toLowerCase(),f=document.getElementById('filter')?.value||'';let es=db.events.filter(e=>(!f||e.childId===f)&&JSON.stringify(e).toLowerCase().includes(q)).sort((a,b)=>new Date(b.date)-new Date(a.date));document.getElementById('hist').innerHTML=es.length?es.map(eventMini).join(''):'<div class="empty">Nessun evento trovato.</div>'}
function reminderForm(r={}){document.getElementById('app').innerHTML=`<div class="card"><h2>${r.id?'✏️ Modifica promemoria':'➕ Nuovo promemoria'}</h2><label>Bambino</label><select id="rchild">${childOptions(r.childId||'')}</select><label>Tipo</label><select id="rtype"><option value="farmaco" ${r.type==='farmaco'?'selected':''}>💊 Farmaco</option><option value="visita" ${r.type==='visita'?'selected':''}>🩺 Visita</option></select><label>Titolo</label><input id="rtitle" value="${esc(r.title||'')}"><label>Data e ora</label><input id="rwhen" type="datetime-local" value="${r.when?new Date(r.when).toISOString().slice(0,16):new Date().toISOString().slice(0,16)}"><label>Dose (se già prescritta)</label><input id="rdose" value="${esc(r.dose||'')}"><label>Note</label><textarea id="rnote">${esc(r.note||'')}</textarea><div class="row" style="margin-top:12px"><button onclick="saveReminderForm('${r.id||''}')">Salva</button><button class="secondary" onclick="show('agenda')">Annulla</button></div></div>`}
function newReminder(){if(!db.children.length)return alert('Prima crea almeno un profilo bambino.');reminderForm()}
function saveReminderForm(id){if(!rchild.value)return alert('Seleziona il bambino.');const data={childId:rchild.value,type:rtype.value,title:rtitle.value.trim()||'Promemoria',when:new Date(rwhen.value).toISOString(),dose:rdose.value.trim(),note:rnote.value.trim(),done:false};if(id){const old=db.reminders.find(r=>r.id===id);Object.assign(old,data,{done:old.done,completedAt:old.completedAt})}else db.reminders.push({id:uid(),...data});save();show('agenda')}
function editReminder(id){reminderForm(db.reminders.find(r=>r.id===id)||{})} function deleteReminder(id){if(!confirm('Eliminare questo promemoria?'))return;db.reminders=db.reminders.filter(r=>r.id!==id);save();show('agenda')} function completeReminder(id){const r=db.reminders.find(x=>x.id===id);r.done=!r.done;r.completedAt=r.done?new Date().toISOString():null;save();show('agenda')}
function reminderMini(r){const c=db.children.find(x=>x.id===r.childId);return `<div class="card"><div class="item-title">${r.type==='farmaco'?'💊':'🩺'} ${esc(r.title)}</div><div class="muted">${esc(c?.name||'')} · ${fmt(r.when)}</div>${r.dose?`<div><b>Dose:</b> ${esc(r.dose)}</div>`:''}${r.note?`<div><b>Note:</b> ${esc(r.note)}</div>`:''}<div class="row" style="margin-top:10px"><button onclick="completeReminder('${r.id}')">${r.done?'↩️ Da fare':'✅ Fatto'}</button><button class="secondary" onclick="editReminder('${r.id}')">✏️ Modifica</button><button class="danger" onclick="deleteReminder('${r.id}')">🗑️ Elimina</button></div></div>`}
function agendaPage(a){let rs=[...db.reminders].sort((a,b)=>new Date(a.when)-new Date(b.when));a.innerHTML=`<div class="top-actions"><h2>⏰ Agenda</h2><button onclick="newReminder()">+ Promemoria</button></div>${rs.length?rs.map(reminderMini).join(''):'<div class="empty">Nessun promemoria o visita.</div>'}`}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{}); show('home');
</script></body></html>
